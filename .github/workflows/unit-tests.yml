name: Run Unit Tests  

on:  
  push:  
    branches: [ master ] 
  pull_request:  
    branches: [ master ]

jobs:  
  build-and-test:  

    runs-on: ubuntu-latest  

    steps:  
    - uses: actions/checkout@v3  

    - name: Set up JDK 21  
      uses: actions/setup-java@v3
      with:
        java-version: '21'  
        distribution: 'temurin'  

    - name: Build with Maven  
      run: ./mvnw clean compile  

    - name: Run Unit Tests  
      run: ./mvnw test  

    - name: Fail if tests fail  
      if: failure()
      run: echo "Tests failed! Check logs above."