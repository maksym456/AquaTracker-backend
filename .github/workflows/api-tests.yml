name: Run API Smoke Tests

on:
  push:
    branches: [ master ]  
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest  

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'  

    - name: Install dependencies 
      run: npm install  

    - name: Run smoke tests
      env:
        JWT: ${{ secrets.JWT_TOKEN }}  
      run: node tests/Api/api-test.js