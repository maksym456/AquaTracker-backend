openapi: 3.0.0
info:
  title: AquaTracker API v1
  description: |
    AquaTracker REST API. All request/response bodies are application/json. Base URL: http://localhost:3001/api/v1/
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Local dev
tags:
  - name: Users
  - name: Settings
  - name: Fish
  - name: Plants
  - name: Aquariums
  - name: Statistics
  - name: Logs
  - name: Contacts
components:
  schemas:
    Id:
      type: integer
      format: int64
      example: 123
    NullableId:
      type: integer
      format: int64
      nullable: true
      example: null
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          example: ValidationError
        message:
          type: string
          example: temperatureC must be between 15 and 35
        field:
          type: string
          nullable: true
          example: temperatureC
        details:
          type: object
          nullable: true
          additionalProperties: true
          example:
            fishId: 1
            conflictingFishIds:
              - 2
      required:
        - error
        - message
    Language:
      type: string
      enum:
        - pl
        - en
    Theme:
      type: string
      enum:
        - light
        - dark
    WaterType:
      type: string
      enum:
        - Słodkowodna
        - Słonawowodna
        - Słonowodna
    UserSettings:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/Language"
        theme:
          $ref: "#/components/schemas/Theme"
        dataSource:
          type: string
          example: production
      required:
        - language
        - theme
        - dataSource
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
          example: aquarist123
        email:
          type: string
          format: email
          example: user@example.com
        createdAt:
          type: string
          format: date-time
          example: 2025-10-27T12:00:00Z
        settings:
          $ref: "#/components/schemas/UserSettings"
      required:
        - id
        - username
        - email
        - createdAt
        - settings
    UserCreateRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          example: aquarist123
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: StrongPassword123!
        settings:
          $ref: "#/components/schemas/UserSettings"
      required:
        - username
        - email
        - password
    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        settings:
          $ref: "#/components/schemas/UserSettings"
    Fish:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          example: Neon Innesa
        waterType:
          $ref: "#/components/schemas/WaterType"
        temperature:
          type: string
          description: "Temperature range string, e.g. \"22-26\""
          example: 22-26
        biotope:
          type: string
          example: Ameryka Południowa
        ph:
          type: string
          example: 6.5-7.5
        hardnessDGH:
          type: string
          example: 1-12
        temperament:
          type: string
          example: spokojne
        minShoalSize:
          type: integer
          minimum: 1
          example: 10
        lifeSpan:
          type: string
          example: 3-5 lat
        iconName:
          type: string
          example: neon_innesa.png
      required:
        - id
        - name
        - waterType
        - temperature
        - biotope
        - ph
        - hardnessDGH
        - temperament
        - minShoalSize
        - lifeSpan
        - iconName
    FishCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        waterType:
          $ref: "#/components/schemas/WaterType"
        temperature:
          type: string
        biotope:
          type: string
        ph:
          type: string
        hardnessDGH:
          type: string
        temperament:
          type: string
        minShoalSize:
          type: integer
          minimum: 1
        lifeSpan:
          type: string
        iconName:
          type: string
      required:
        - name
        - waterType
        - temperature
        - biotope
        - ph
        - hardnessDGH
        - temperament
        - minShoalSize
        - lifeSpan
        - iconName
    FishUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        waterType:
          $ref: "#/components/schemas/WaterType"
        temperature:
          type: string
        biotope:
          type: string
        ph:
          type: string
        hardnessDGH:
          type: string
        temperament:
          type: string
        minShoalSize:
          type: integer
          minimum: 1
        lifeSpan:
          type: string
        iconName:
          type: string
    Plant:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          example: Moczarka
        temperature:
          type: string
          example: 12-20
        biotope:
          type: string
          example: Ameryka Północna
        ph:
          type: string
          example: 6.0-8.0
        hardnessDGH:
          type: string
          example: 5-20
        iconName:
          type: string
          example: moczarka.png
      required:
        - id
        - name
        - temperature
        - biotope
        - ph
        - hardnessDGH
        - iconName
    PlantCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        temperature:
          type: string
        biotope:
          type: string
        ph:
          type: string
        hardnessDGH:
          type: string
        iconName:
          type: string
      required:
        - name
        - temperature
        - biotope
        - ph
        - hardnessDGH
        - iconName
    PlantUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        temperature:
          type: string
        biotope:
          type: string
        ph:
          type: string
        hardnessDGH:
          type: string
        iconName:
          type: string
    AquariumFishItem:
      type: object
      additionalProperties: false
      properties:
        fishId:
          $ref: "#/components/schemas/Id"
        count:
          type: integer
          minimum: 0
          example: 6
      required:
        - fishId
        - count
    AquariumPlantItem:
      type: object
      additionalProperties: false
      properties:
        plantId:
          $ref: "#/components/schemas/Id"
        count:
          type: integer
          minimum: 0
          example: 2
      required:
        - plantId
        - count
    StatusIssue:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          example: TEMPERATURE_OUT_OF_RANGE
        message:
          type: string
          example: Temperatura 30°C poza zakresem dla Neon Innesa (22-26).
      required:
        - type
        - message
    AquariumStatus:
      type: object
      additionalProperties: false
      properties:
        level:
          type: string
          enum:
            - OK
            - WARNING
            - ERROR
          example: WARNING
        issues:
          type: array
          items:
            $ref: "#/components/schemas/StatusIssue"
        lastCheckedAt:
          type: string
          format: date-time
          example: 2025-01-25T11:00:00Z
      required:
        - level
        - issues
        - lastCheckedAt
    Aquarium:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        ownerId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          example: Moje pierwsze akwarium
        description:
          type: string
          nullable: true
          example: Pierwsze domowe akwarium
        volumeLiters:
          type: integer
          minimum: 1
          example: 120
        waterType:
          $ref: "#/components/schemas/WaterType"
        temperatureC:
          type: number
          example: 26
        ph:
          type: number
          example: 7.2
        hardnessDGH:
          type: number
          example: 10
        fish:
          type: array
          items:
            $ref: "#/components/schemas/AquariumFishItem"
        plants:
          type: array
          items:
            $ref: "#/components/schemas/AquariumPlantItem"
        status:
          $ref: "#/components/schemas/AquariumStatus"
        createdAt:
          type: string
          format: date-time
          example: 2025-01-20T09:00:00Z
      required:
        - id
        - ownerId
        - name
        - volumeLiters
        - waterType
        - temperatureC
        - ph
        - hardnessDGH
        - fish
        - plants
        - status
        - createdAt
    AquariumCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        volumeLiters:
          type: integer
          minimum: 1
        waterType:
          $ref: "#/components/schemas/WaterType"
        temperatureC:
          type: number
        ph:
          type: number
        hardnessDGH:
          type: number
        fish:
          type: array
          items:
            $ref: "#/components/schemas/AquariumFishItem"
        plants:
          type: array
          items:
            $ref: "#/components/schemas/AquariumPlantItem"
      required:
        - name
        - volumeLiters
        - waterType
        - temperatureC
        - ph
        - hardnessDGH
        - fish
        - plants
    AquariumUpdateRequest:
      $ref: "#/components/schemas/AquariumCreateRequest"
    AquariumParametersUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        temperatureC:
          type: number
        ph:
          type: number
        hardnessDGH:
          type: number
    AddFishToAquariumRequest:
      type: object
      additionalProperties: false
      properties:
        fishId:
          $ref: "#/components/schemas/Id"
        count:
          type: integer
          minimum: 1
      required:
        - fishId
        - count
    UpdateFishCountRequest:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
      required:
        - count
    AddPlantToAquariumRequest:
      type: object
      additionalProperties: false
      properties:
        plantId:
          $ref: "#/components/schemas/Id"
        count:
          type: integer
          minimum: 1
      required:
        - plantId
        - count
    UpdatePlantCountRequest:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
      required:
        - count
    LogActionType:
      type: string
      enum:
        - AQUARIUM_CREATED
        - AQUARIUM_UPDATED
        - FISH_ADDED
        - FISH_UPDATED
        - FISH_REMOVED
        - PLANT_ADDED
        - PLANT_UPDATED
        - PLANT_REMOVED
        - PARAM_CHANGED
    LogEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        userId:
          $ref: "#/components/schemas/Id"
        aquariumId:
          $ref: "#/components/schemas/Id"
        aquariumName:
          type: string
          example: Moje pierwsze akwarium
        actionType:
          $ref: "#/components/schemas/LogActionType"
        title:
          type: string
          example: Zmieniono parametr
        message:
          type: string
          example: "Zmieniono twardość wody: 10 dGH → 12 dGH"
        createdAt:
          type: string
          format: date-time
          example: 2025-01-23T14:30:00Z
        metadata:
          type: object
          additionalProperties: true
          example:
            parameter: hardnessDGH
            oldValue: 10
            newValue: 12
      required:
        - id
        - userId
        - aquariumId
        - aquariumName
        - actionType
        - title
        - message
        - createdAt
        - metadata
    AquariumAndLogResponse:
      type: object
      additionalProperties: false
      properties:
        aquarium:
          $ref: "#/components/schemas/Aquarium"
        logEntry:
          $ref: "#/components/schemas/LogEntry"
      required:
        - aquarium
        - logEntry
    Settings:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/Language"
        theme:
          $ref: "#/components/schemas/Theme"
        sessionLengthMinutes:
          type: integer
          minimum: 1
          example: 60
        dataSource:
          type: string
          example: production
      required:
        - language
        - theme
        - sessionLengthMinutes
        - dataSource
    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/Language"
        theme:
          $ref: "#/components/schemas/Theme"
        sessionLengthMinutes:
          type: integer
          minimum: 1
        dataSource:
          type: string
    InvitationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED
    ContactStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
    Contact:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        userId:
          $ref: "#/components/schemas/Id"
        friendId:
          $ref: "#/components/schemas/Id"
        friendName:
          type: string
          example: Jan Kowalski
        friendEmail:
          type: string
          format: email
          example: jan.kowalski@example.com
        status:
          $ref: "#/components/schemas/ContactStatus"
        createdAt:
          type: string
          format: date-time
          example: 2025-01-20T10:00:00Z
      required:
        - id
        - userId
        - friendId
        - friendName
        - friendEmail
        - status
        - createdAt
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        senderId:
          $ref: "#/components/schemas/Id"
        recipientEmail:
          type: string
          format: email
          example: anna.nowak@example.com
        recipientUserId:
          $ref: "#/components/schemas/NullableId"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        createdAt:
          type: string
          format: date-time
          example: 2025-01-21T09:00:00Z
        respondedAt:
          type: string
          format: date-time
          nullable: true
          example: null
      required:
        - id
        - senderId
        - recipientEmail
        - status
        - createdAt
        - respondedAt
    ContactsOverview:
      type: object
      additionalProperties: false
      properties:
        friends:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
      required:
        - friends
        - invitations
    SendInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: anna.nowak@example.com
      required:
        - email
    SendInvitationResponse:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
      required:
        - invitation
    AcceptInvitationResponse:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        contact:
          $ref: "#/components/schemas/Contact"
      required:
        - invitation
        - contact
    StatsGlobal:
      type: object
      additionalProperties: false
      properties:
        totalAquariums:
          type: integer
          example: 2
        totalFishCount:
          type: integer
          example: 2
        totalPlantCount:
          type: integer
          example: 3
        fishSpeciesCount:
          type: integer
          example: 1
        plantSpeciesCount:
          type: integer
          example: 2
        fishDistribution:
          type: array
          items:
            $ref: "#/components/schemas/StatsDistributionItem"
        plantDistribution:
          type: array
          items:
            $ref: "#/components/schemas/StatsDistributionItem"
        mostCommonFish:
          $ref: "#/components/schemas/StatsMostCommon"
        mostCommonPlant:
          $ref: "#/components/schemas/StatsMostCommon"
      required:
        - totalAquariums
        - totalFishCount
        - totalPlantCount
        - fishSpeciesCount
        - plantSpeciesCount
        - fishDistribution
        - plantDistribution
        - mostCommonFish
        - mostCommonPlant
    StatsSingleAquarium:
      type: object
      additionalProperties: false
      properties:
        aquariumId:
          $ref: "#/components/schemas/Id"
        fishCount:
          type: integer
          example: 1
        plantCount:
          type: integer
          example: 2
        fishSpeciesCount:
          type: integer
          example: 1
        plantSpeciesCount:
          type: integer
          example: 2
        fishDistribution:
          type: array
          items:
            $ref: "#/components/schemas/StatsDistributionItem"
        plantDistribution:
          type: array
          items:
            $ref: "#/components/schemas/StatsDistributionItem"
        mostCommonFish:
          $ref: "#/components/schemas/StatsMostCommon"
        mostCommonPlant:
          $ref: "#/components/schemas/StatsMostCommon"
      required:
        - aquariumId
        - fishCount
        - plantCount
        - fishSpeciesCount
        - plantSpeciesCount
        - fishDistribution
        - plantDistribution
        - mostCommonFish
        - mostCommonPlant
    StatsDistributionItem:
      type: object
      additionalProperties: false
      properties:
        fishId:
          $ref: "#/components/schemas/NullableId"
        plantId:
          $ref: "#/components/schemas/NullableId"
        name:
          type: string
          example: Neon Innesa
        count:
          type: integer
          example: 1
        percentage:
          type: number
          example: 100.0
      required:
        - name
        - count
        - percentage
    StatsMostCommon:
      type: object
      additionalProperties: false
      properties:
        fishId:
          $ref: "#/components/schemas/NullableId"
        plantId:
          $ref: "#/components/schemas/NullableId"
        name:
          type: string
          example: Neon Innesa
        count:
          type: integer
          example: 1
        percentage:
          type: number
          example: 100.0
      required:
        - name
        - count
        - percentage
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /users:
    get:
      summary: List users (optionally filter by email)
      description: |
        Lists users. Intended for admin/internal usage.
        Use `email` to fetch user by email as a convenience filter.
      tags:
        - Users
      parameters:
        - name: email
          in: query
          schema:
            type: string
            format: email
          description: Exact email match.
        - name: q
          in: query
          schema:
            type: string
          description: Partial match on username/email (implementation-defined).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    post:
      summary: Create user
      description: Creates a new user account.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/by-email:
    get:
      summary: Get user by email
      tags:
        - Users
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          example: anna.nowak@example.com
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /users/me:
    get:
      summary: Get current user
      tags:
        - Users
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /users/{userId}:
    get:
      summary: Get user by id
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          example: 123
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      summary: Update user (partial)
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      summary: Delete user
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /settings:
    get:
      summary: Get settings
      tags:
        - Settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
              example:
                language: pl
                theme: dark
                sessionLengthMinutes: 60
                dataSource: production
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      summary: Update settings (partial)
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
